[package]
name = "dropmesh"
version = "0.1.0"
edition = "2021"
description = "Cross-platform peer-to-peer file sharing. No cloud. No accounts."
license = "MIT"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
ring = "0.17"
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
mdns-sd = "0.11"
quinn = "0.11"
rustls = { version = "0.23", features = ["ring"] }
rustls-pemfile = "2"
rcgen = "0.13"          # self-signed TLS certs for QUIC
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1"
log = "0.4"
env_logger = "0.11"
dirs = "5"
rand = "0.8"
walkdir = "2"
hostname = "0.4"
if-addrs = "0.13"
spake2 = "0.4"          # PAKE: secure pairing against offline brute-force
hmac = "0.12"           # HMAC-SHA256 for file authentication
keyring = "2"           # OS keychain: macOS Keychain, Windows Credential Manager
tokio-util = { version = "0.7", features = ["codec"] }
bytes = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
